  # fact table

  - name: fact_sales
    description: >
      Sales fact table at one row per order item. Each transaction is linked
      to the dimension version that was effective when the order was placed.
    columns:
      - name: order_item_id
        description: Primary grain of the fact table
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Degenerate order dimension
        data_tests:
          - not_null

      - name: order_date
        description: Date on which the order was placed
        data_tests:
          - not_null

      - name: ordered_at
        description: Timestamp at which the order was placed
        data_tests:
          - not_null

      - name: book_key
        description: SCD2 surrogate key of the book at the time of sale
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_books')
                field: book_key

      - name: customer_key
        description: SCD2 surrogate key of the customer at the time of sale
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: store_key
        description: SCD2 surrogate key of the store at the time of sale
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_key

      - name: staff_key
        description: SCD2 surrogate key of the staff member at the time of sale
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key

      - name: promotion_key
        description: SCD2 surrogate key of the promotion at the time of sale
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promotion_key

      - name: book_id
        description: Natural key of the book
        data_tests:
          - not_null

      - name: customer_id
        description: Natural key of the customer; may be null for guest orders

      - name: store_id
        description: Natural key of the store
        data_tests:
          - not_null

      - name: staff_id
        description: Natural key of the staff member; may be null for online orders

      - name: promotion_id
        description: Natural key of the promotion; null when no promotion was used

      - name: sales_channel
        description: Channel through which the sale was made
        data_tests:
          - not_null

      - name: payment_method
        description: Payment method used for the order

      - name: order_status
        description: Current status of the order
        data_tests:
          - not_null

      - name: quantity
        description: Number of units sold
        data_tests:
          - not_null

      - name: unit_price
        description: Selling price per unit
        data_tests:
          - not_null

      - name: discount_amount
        description: Total discount applied to the order item
        data_tests:
          - not_null

      - name: unit_cost
        description: Historical cost per unit from the matching book version
        data_tests:
          - not_null

      - name: gross_sales
        description: Quantity multiplied by unit price
        data_tests:
          - not_null

      - name: net_sales
        description: Gross sales minus discount amount
        data_tests:
          - not_null

      - name: total_cost
        description: Quantity multiplied by unit cost
        data_tests:
          - not_null

      - name: gross_profit
        description: Net sales minus total cost
        data_tests:
          - not_null

      - name: is_completed
        description: Indicates whether the order was completed
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: _loaded_at
        description: Timestamp at which dbt generated the record
        data_tests:
          - not_null