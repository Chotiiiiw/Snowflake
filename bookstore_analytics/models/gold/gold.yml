version: 2

models:
  # dimension tables 
  - name: dim_books
    description: >
      SCD Type 2 book dimension. A book can have multiple historical versions,
      but should have no more than one current record.
    columns:
      - name: book_key
        description: Surrogate key generated by the dbt snapshot
        data_tests:
          - not_null
          - unique

      - name: book_id
        description: Natural key of the book
        data_tests:
          - not_null

      - name: book_version_number
        description: Sequential version number of the book
        data_tests:
          - not_null

      - name: publisher_id
        description: Natural key of the publisher

      - name: valid_from
        description: Timestamp from which this version is effective
        data_tests:
          - not_null

      - name: valid_to
        description: Timestamp until which this version is effective; null for the current record

      - name: is_current
        description: Indicates whether this is the current version
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_customers
